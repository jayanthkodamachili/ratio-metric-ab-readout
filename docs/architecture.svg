<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of ratio-metric-ab-readout"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">One effect, three standard errors, and the unit each one believes in</text><rect x="24" y="54" width="190" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="119.0" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">seeded generator</text><text x="119.0" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">users, not events</text><text x="119.0" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">fixed seed, no network</text><rect x="24" y="142" width="190" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="119.0" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">one row per user</text><text x="119.0" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">events and successes</text><text x="119.0" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">per randomisation unit</text><line x1="119" y1="110" x2="119" y2="142" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="238" width="190" height="50" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="119.0" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">SRM gate</text><text x="119.0" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">assignment sane?</text><line x1="119" y1="198" x2="119" y2="238" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="78" width="300" height="58" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="426.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">flatten to one row per event</text><text x="426.0" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the correlation is hidden, not removed</text><rect x="276" y="182" width="300" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="426.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">keep the user as the unit</text><text x="426.0" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">delta method, closed form</text><rect x="276" y="262" width="300" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="426.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">resample users with replacement</text><text x="426.0" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">cluster bootstrap, the oracle</text><line x1="214" y1="165" x2="276" y2="107" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="214" y1="170" x2="276" y2="211" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="214" y1="178" x2="276" y2="291" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="630" y="78" width="180" height="58" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="720.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">p = 0.012</text><text x="720.0" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">too small by 1.5x</text><rect x="630" y="182" width="180" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="720.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">p = 0.092</text><text x="720.0" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">honest</text><rect x="630" y="262" width="180" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="720.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">p = 0.090</text><text x="720.0" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">honest</text><line x1="576" y1="107" x2="630" y2="107" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="576" y1="211" x2="630" y2="211" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="576" y1="291" x2="630" y2="291" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="720" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">same rows, same effect,</text><text x="720" y="167" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">different verdict</text><rect x="140" y="392" width="680" height="76" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">the effect is identical in all three; only its uncertainty moves</text><text x="480.0" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">no property of the naive p-value reveals the problem, because the problem is an assumption</text><text x="480.0" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the number never encodes: that the events were independent</text><line x1="720" y1="320" x2="600" y2="392" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="426" y1="240" x2="400" y2="392" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="245" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">same</text><text x="245" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">rows</text></svg>
